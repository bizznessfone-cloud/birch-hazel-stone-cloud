name: CP26C-O2C Single-Use First Owner Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BOOTSTRAP-FIRST-OWNER
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-mutation
  cancel-in-progress: false

jobs:
  bootstrap-first-owner:
    name: bootstrap-first-owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap first platform Owner for sbg-verify-a5
        env:
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
          CP26CO2C_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/cp26co2c-first-owner-bootstrap.mjs

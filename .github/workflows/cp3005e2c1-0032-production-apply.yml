# TEMPORARY single-use CP30.05E-2C.1 Production apply for migration 0032.
# Delete this file immediately after one successful verified apply.
# Not a permanent mutation surface. Does not call a payment provider or change DNS.
name: CP30.05E-2C.1 0032 single-use Production apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact confirmation APPLY-0032
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cp3005e2c1-0032-production-apply
  cancel-in-progress: false

jobs:
  apply:
    name: apply-0032
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmation APPLY-0032
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "APPLY-0032" ]; then
            echo "BLOCKED — CONFIRMATION PHRASE INVALID"
            exit 1
          fi
          echo "confirmation: ACCEPTED"

      - name: Checkout authorised commit
        uses: actions/checkout@v4
        with:
          ref: b3bbe7611a78b39f5a44f5556c3418b0d87f89c1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migration 0032 only
        env:
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
          CP3005E2C1_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/cp3005e2c1-0032-production-migrate.mjs

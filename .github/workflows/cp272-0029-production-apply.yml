                   has_table_privilege('aether_app', 'public.sbg_domain_a_checkout_claims', 'DELETE') as app_delete,
                   has_table_privilege('public', 'public.sbg_domain_a_checkout_claims', 'INSERT') as public_insert,
                   has_table_privilege('public', 'public.sbg_domain_a_checkout_claims', 'UPDATE') as public_update,
                   has_table_privilege('public', 'public.sbg_domain_a_checkout_claims', 'DELETE') as public_delete,
                   has_table_privilege('aether_runtime', 'public.sbg_domain_a_checkout_claims', 'INSERT') as runtime_insert,
                   has_table_privilege('aether_runtime', 'public.sbg_domain_a_checkout_claims', 'UPDATE') as runtime_update,
                   has_table_privilege('aether_runtime', 'public.sbg_domain_a_checkout_claims', 'DELETE') as runtime_delete`,

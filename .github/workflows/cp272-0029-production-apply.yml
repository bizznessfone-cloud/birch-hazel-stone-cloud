# TEMPORARY single-use CP27.2 Production apply for migration 0029.
# Delete this file immediately after one successful verified apply.
# Not a permanent mutation surface. Does not call Stripe or Vercel.
name: CP27.2 0029 single-use Production apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact confirmation APPLY-0029
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cp272-0029-production-apply
  cancel-in-progress: false

jobs:
  apply:
    name: apply-0029
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmation APPLY-0029
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "APPLY-0029" ]; then
            echo "BLOCKED — CONFIRMATION PHRASE INVALID"
            exit 1
          fi
          echo "confirmation: ACCEPTED"

      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read-only pre-apply snapshot
        env:
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
          SNAPSHOT_LABEL: pre-apply
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";

          const label = process.env.SNAPSHOT_LABEL || "snapshot";
          const url = String(process.env.AETHER_DATABASE_OWNER_URL ?? "").trim();
          function redact(text) {
            return String(text ?? "")
              .replace(/(?:postgres(?:ql)?:\/\/)\S+/gi, "postgres://redacted")
              .replace(/AETHER_DATABASE_OWNER_URL\S*/gi, "AETHER_DATABASE_OWNER_URL=redacted");
          }
          function say(line) {
            console.log(line);
          }
          if (!url) {
            console.log("BLOCKED — AETHER_DATABASE_OWNER_URL is not configured");
            process.exit(1);
          }
          say(`snapshot: ${label}`);
          say(`AETHER_DATABASE_OWNER_URL: PRESENT`);
          const pool = new pg.Pool({ connectionString: url, max: 1 });
          const client = await pool.connect();
          try {
            await client.query("BEGIN READ ONLY");
            const mode = await client.query("select current_setting('transaction_read_only') as mode");
            if (mode.rows[0]?.mode !== "on") throw new Error("snapshot transaction is not read only");
            const identity = await client.query(
              "select current_database() as database, current_user, session_user",
            );
            const id = identity.rows[0];
            say(`database: ${id.database}`);
            say(`current_user: ${id.current_user}`);
            say(`session_user: ${id.session_user}`);
            const ledger = await client.query("select name from _migrations order by name");
            say("ledger:");
            for (const row of ledger.rows) say(`  ${row.name}`);
            const objects = await client.query(
              `select to_regclass('public.sbg_domain_a_checkout_claims') is not null as table_present,
                      to_regprocedure('sbg_claim_domain_a_checkout(text,uuid,integer,integer)') is not null as claim_fn,
                      to_regprocedure('sbg_attach_domain_a_checkout_session(text,uuid,uuid,text,text)') is not null as attach_fn,
                      to_regprocedure('sbg_release_domain_a_checkout_claim(text,uuid,uuid)') is not null as release_fn`,
            );
            const obj = objects.rows[0];
            say(`claim_table: ${obj.table_present ? "PRESENT" : "ABSENT"}`);
            say(`claim_fn: ${obj.claim_fn ? "PRESENT" : "ABSENT"}`);
            say(`attach_fn: ${obj.attach_fn ? "PRESENT" : "ABSENT"}`);
            say(`release_fn: ${obj.release_fn ? "PRESENT" : "ABSENT"}`);
            if (!obj.table_present) say("claim_rows: ABSENT");
            if (obj.table_present) {
              const constraints = await client.query(
                `select con.conname, pg_get_constraintdef(con.oid) as def
                   from pg_constraint con
                   join pg_class c on c.oid = con.conrelid
                   join pg_namespace n on n.oid = c.relnamespace
                  where n.nspname = 'public'
                    and c.relname = 'sbg_domain_a_checkout_claims'
                  order by con.conname`,
              );
              say("constraints:");
              for (const row of constraints.rows) say(`  ${row.conname}: ${row.def}`);
              const rows = await client.query(
                "select count(*)::int as n from public.sbg_domain_a_checkout_claims",
              );
              say(`claim_rows: ${rows.rows[0].n}`);
              const priv = await client.query(
                `select
                   has_table_privilege('aether_app', 'public.sbg_domain_a_checkout_claims', 'SELECT') as app_select,
                   has_table_privilege('aether_app', 'public.sbg_domain_a_checkout_claims', 'INSERT') as app_insert,
                   has_table_privilege('aether_app', 'public.sbg_domain_a_checkout_claims', 'UPDATE') as app_update,
                   has_table_privilege('aether_app', 'public.sbg_domain_a_checkout_claims', 'DELETE') as app_delete,
                   has_table_privilege('public', 'public.sbg_domain_a_checkout_claims', 'INSERT') as public_insert,
                   has_table_privilege('public', 'public.sbg_domain_a_checkout_claims', 'UPDATE') as public_update,
                   has_table_privilege('public', 'public.sbg_domain_a_checkout_claims', 'DELETE') as public_delete,
                   has_table_privilege('aether_runtime', 'public.sbg_domain_a_checkout_claims', 'INSERT') as runtime_insert,
                   has_table_privilege('aether_runtime', 'public.sbg_domain_a_checkout_claims', 'UPDATE') as runtime_update,
                   has_table_privilege('aether_runtime', 'public.sbg_domain_a_checkout_claims', 'DELETE') as runtime_delete`,
              );
              say(`privileges.table: ${JSON.stringify(priv.rows[0])}`);
            }
            if (obj.claim_fn && obj.attach_fn && obj.release_fn) {
              const fns = await client.query(
                `select p.proname, p.prosecdef, p.proconfig::text as proconfig
                   from pg_proc p
                   join pg_namespace n on n.oid = p.pronamespace
                  where n.nspname = 'public'
                    and p.proname in (
                      'sbg_claim_domain_a_checkout',
                      'sbg_attach_domain_a_checkout_session',
                      'sbg_release_domain_a_checkout_claim'
                    )
                  order by p.proname`,
              );
              say("functions:");
              for (const row of fns.rows) {
                say(`  ${row.proname} security_definer=${row.prosecdef} proconfig=${row.proconfig}`);
              }
              const def = await client.query(
                "select pg_get_functiondef('sbg_claim_domain_a_checkout(text,uuid,integer,integer)'::regprocedure) as def",
              );
              const body = String(def.rows[0]?.def ?? "");
              const locks = /public\.sbg_organisations[\s\S]*for update/i.test(body);
              say(`claim_org_for_update: ${locks ? "YES" : "NO"}`);
              const exec = await client.query(
                `select
                   has_function_privilege('aether_app', 'sbg_claim_domain_a_checkout(text,uuid,integer,integer)', 'EXECUTE') as app_claim,
                   has_function_privilege('aether_app', 'sbg_attach_domain_a_checkout_session(text,uuid,uuid,text,text)', 'EXECUTE') as app_attach,
                   has_function_privilege('aether_app', 'sbg_release_domain_a_checkout_claim(text,uuid,uuid)', 'EXECUTE') as app_release,
                   has_function_privilege('public', 'sbg_claim_domain_a_checkout(text,uuid,integer,integer)', 'EXECUTE') as public_claim,
                   has_function_privilege('public', 'sbg_attach_domain_a_checkout_session(text,uuid,uuid,text,text)', 'EXECUTE') as public_attach,
                   has_function_privilege('public', 'sbg_release_domain_a_checkout_claim(text,uuid,uuid)', 'EXECUTE') as public_release,
                   has_function_privilege('aether_runtime', 'sbg_claim_domain_a_checkout(text,uuid,integer,integer)', 'EXECUTE') as runtime_claim,
                   has_function_privilege('aether_runtime', 'sbg_attach_domain_a_checkout_session(text,uuid,uuid,text,text)', 'EXECUTE') as runtime_attach,
                   has_function_privilege('aether_runtime', 'sbg_release_domain_a_checkout_claim(text,uuid,uuid)', 'EXECUTE') as runtime_release`,
              );
              say(`privileges.execute: ${JSON.stringify(exec.rows[0])}`);
            }
            const billing = await client.query(
              `select o.id::text as organisation_id, o.name, b.status, b.billing_interval,
                      b.licensed_quantity, b.stripe_customer_id, b.stripe_subscription_id, b.stripe_price_id
                 from sbg_organisation_billing b
                 join sbg_organisations o on o.id = b.organisation_id
                order by o.id`,
            );
            say("organisation_billing:");
            for (const row of billing.rows) say(`  ${JSON.stringify(row)}`);
            const balance = await client.query(
              `select organisation_id::text, licensed_quantity, active_allocations, available_licences
                 from sbg_organisation_licence_balance
                order by organisation_id`,
            );
            say("licence_balance:");
            for (const row of balance.rows) say(`  ${JSON.stringify(row)}`);
            const hotels = await client.query("select code, status from hotels order by code");
            say("hotels:");
            for (const row of hotels.rows) say(`  ${row.code}=${row.status}`);
            const alloc = await client.query(
              `select count(*)::int as total,
                      cast(count(*) filter (where released_at is null) as int) as active
                 from sbg_property_licence_allocations`,
            );
            say(`allocations: ${JSON.stringify(alloc.rows[0])}`);
            const payments = await client.query("select count(*)::int as n from sbg_booking_payments");
            say(`booking_payments: ${payments.rows[0].n}`);
            const accounts = await client.query("select count(*)::int as n from sbg_billing_accounts");
            say(`billing_accounts: ${accounts.rows[0].n}`);
            const prices = await client.query(
              `select id::text, plan_code, currency, amount_minor, billing_interval, interval_count,
                      purchasable, retired_at is not null as retired
                 from sbg_saas_price_versions
                order by id`,
            );
            say("price_versions:");
            for (const row of prices.rows) say(`  ${JSON.stringify(row)}`);
            const maps = await client.query(
              `select environment, status, stripe_product_id, stripe_price_id, price_version_id::text
                 from sbg_saas_stripe_mappings
                order by environment, stripe_price_id`,
            );
            say("stripe_mappings:");
            for (const row of maps.rows) say(`  ${JSON.stringify(row)}`);
            const locks = await client.query(
              "select live_mapping_enabled, live_checkout_enabled from sbg_saas_commerce_locks where id = 1",
            );
            say(`commerce_locks: ${JSON.stringify(locks.rows[0] ?? null)}`);
            await client.query("ROLLBACK");
            say(`snapshot_complete: ${label}`);
          } catch (err) {
            try { await client.query("ROLLBACK"); } catch { /* keep original */ }
            console.log(redact(err?.message || err));
            process.exit(1);
          } finally {
            client.release();
            await pool.end();
          }
          NODE

      - name: Apply reviewed migration 0029
        env:
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
          CP272_CONFIRMATION: APPLY-0029
        run: node scripts/cp272-0029-production-migrate.mjs

      - name: Read-only post-apply snapshot
        env:
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}

# Verification only. No Production migration step. Does not create a Neon branch.
# The writable connection is the existing isolated branch owner secret.
name: CP30.05E-2D-2C.1 0034 isolated verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact confirmation VERIFY-0034-ISOLATED
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cp3005e2d2c1-0034-isolated-verify
  cancel-in-progress: false

jobs:
  verify:
    name: verify-0034-isolated
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmation VERIFY-0034-ISOLATED
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "VERIFY-0034-ISOLATED" ]; then
            echo "BLOCKED — CONFIRMATION PHRASE INVALID"
            exit 1
          fi
          echo "confirmation: ACCEPTED"

      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove classification on the existing isolated branch
        env:
          AETHER_0034_ISOLATED_OWNER_URL: ${{ secrets.AETHER_0034_ISOLATED_OWNER_URL }}
          CP3005E2D2C1_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/cp3005e2d2c1-neon-concurrency.mjs

name: A3 admission controller offline verification
on:
  push:
    branches:
      - review/a3-m36-closeout-0035-0036-admission
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-admission-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run admission controller tests without database credentials
        env:
          DATABASE_URL: ''
          NEON_API_KEY: ''
          A3_PREFLIGHT_READONLY_URL: ''
        run: node --test scripts/a3-0035-0036-production-admission-preflight.test.mjs

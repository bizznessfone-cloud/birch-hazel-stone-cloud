# Manual Stripe TEST Checkout structure diagnostic.
# Not registered on main and not dispatched by this commit.
# CHECKOUT_DIAGNOSTIC_EXECUTION_GATE is closed unless the diagnostic permit matches.
name: SBG Stripe TEST checkout diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbg-stripe-test-checkout-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/test/stripe-gate2-runner' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sbg-stripe-test
    env:
      SBG_DOMAIN_B_LIVE_CHECKOUT: "false"
      SBG_SAAS_COMMERCE: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run closed Stripe TEST structure diagnostic
        run: node --experimental-strip-types .github/scripts/stripe-test-checkout-diagnostic.ts
        env:
          DEBUG: ""
          NODE_DEBUG: ""
          NODE_OPTIONS: ""
          STRIPE_SECRET_KEY: ${{ secrets.SBG_STRIPE_TEST_SECRET_KEY }}
          SBG_AUTHORISED_DIAGNOSTIC_SHA: ${{ vars.SBG_AUTHORISED_DIAGNOSTIC_SHA }}

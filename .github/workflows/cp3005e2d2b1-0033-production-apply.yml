# TEMPORARY single-use CP30.05E-2D-2B.1 Production apply for migration 0033.
# Delete this file immediately after one successful verified apply.
# Not a permanent mutation surface. Does not call a payment provider or change DNS.
name: CP30.05E-2D-2B.1 0033 single-use Production apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact confirmation APPLY-0033
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cp3005e2d2b1-0033-production-apply
  cancel-in-progress: false

jobs:
  apply:
    name: apply-0033
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmation APPLY-0033
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "APPLY-0033" ]; then
            echo "BLOCKED — CONFIRMATION PHRASE INVALID"
            exit 1
          fi
          echo "confirmation: ACCEPTED"

      - name: Production health before
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://scanbookgo.com/)
          echo "home_status: $code"
          test "$code" = "200"
          ready=$(curl -fsS https://scanbookgo.com/api/ready)
          echo "ready: $ready"
          test "$ready" = '{"ok":true}'

      - name: Checkout authorised commit
        uses: actions/checkout@v4
        with:
          ref: 468cfd5708f93c049bd9f395f49711577d44f2ac
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migration 0033 only
        env:
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
          CP3005E2D2B1_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/cp3005e2d2b1-0033-production-migrate.mjs

      - name: Neon founding concurrency proof
        env:
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
          CP3005E2D2B1_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/cp3005e2d2b1-neon-concurrency.mjs

      - name: Production health after
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://scanbookgo.com/)
          echo "home_status: $code"
          test "$code" = "200"
          ready=$(curl -fsS https://scanbookgo.com/api/ready)
          echo "ready: $ready"
          test "$ready" = '{"ok":true}'

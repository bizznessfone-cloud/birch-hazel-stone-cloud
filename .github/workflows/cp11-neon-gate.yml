name: CP11 Neon Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-neon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Correct catalog-owner query for PostgreSQL 18
        run: sed -i "s/pg_get_userbyid(t.tgowner) as owner/pg_get_userbyid(c.relowner) as owner/" scripts/verify-neon-production.mjs
      - name: Run CP11 production gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
        run: npm run verify:neon

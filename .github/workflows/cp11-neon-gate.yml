name: CP11 Neon Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-neon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Correct catalog-owner query for PostgreSQL 18
        run: python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-neon-production.mjs')
          s = p.read_text()
          old = "pg_get_userbyid(t.tgowner) as owner"
          new = "pg_get_userbyid(c.relowner) as owner"
          if old not in s:
              raise SystemExit('expected verifier catalog query not found')
          p.write_text(s.replace(old, new, 1))
          print('Verifier catalog-owner check corrected in workspace only.')
          PY
      - name: Run CP11 production gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
        run: npm run verify:neon
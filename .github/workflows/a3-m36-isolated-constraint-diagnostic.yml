# A3-M36 isolated constraint diagnostic. Manual dispatch only.
# Read-only. Does not apply SQL, insert a ledger row, or change the verifier.
# Does not install migration 0036 and does not run concurrency or recovery.
name: A3-M36 isolated constraint diagnostic

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact confirmation DIAGNOSE-0036-CONSTRAINTS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: a3-m36-isolated-constraint-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: diagnose-0036-constraints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the diagnostic confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DIAGNOSE-0036-CONSTRAINTS" ]; then
            echo "BLOCKED — CONFIRMATION PHRASE INVALID"
            exit 1
          fi
          echo "confirmation: ACCEPTED"
          echo "stage: diagnose-constraints"

      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require isolated owner secret
        env:
          AETHER_0036_ISOLATED_OWNER_URL: ${{ secrets.AETHER_0036_ISOLATED_OWNER_URL }}
        run: |
          if [ -z "$AETHER_0036_ISOLATED_OWNER_URL" ]; then
            echo "BLOCKED — AETHER_0036_ISOLATED_OWNER_URL is absent. No database was opened."
            exit 1
          fi
          echo "AETHER_0036_ISOLATED_OWNER_URL: PRESENT"

      - name: Read approval-table constraints on the isolated branch
        env:
          AETHER_0036_ISOLATED_OWNER_URL: ${{ secrets.AETHER_0036_ISOLATED_OWNER_URL }}
          A3M36_CONSTRAINT_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/a3-m36-isolated-constraint-diagnostic.mjs

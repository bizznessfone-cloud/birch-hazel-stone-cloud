name: CP26 Stripe Test Read-Only Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read-only commercial snapshot
        env:
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
        run: node scripts/cp26-stripe-test-snapshot.mjs

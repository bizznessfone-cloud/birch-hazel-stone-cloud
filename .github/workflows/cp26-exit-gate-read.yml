name: CP26 Exit Gate Read
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type READ-CP26-DUPLICATE-AFTERMATH
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-database-mutation
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read CP26 exit-gate production state
        env:
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
          CP26_CONFIRMATION: ${{ inputs.confirmation }}
          CP26_MODE: aftermath
        run: node scripts/cp26-property-licence-proof.mjs

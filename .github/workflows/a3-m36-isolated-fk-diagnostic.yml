# A3-M36 isolated foreign-key diagnostic. Manual dispatch only.
# Read-only. Does not delete rows, apply SQL, or run recovery.
# Does not use a Production credential. Does not open the recovery branch.
name: A3-M36 isolated foreign-key diagnostic

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact confirmation DIAGNOSE-0036-FOREIGN-KEYS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: a3-m36-isolated-fk-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: diagnose-0036-foreign-keys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the diagnostic confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DIAGNOSE-0036-FOREIGN-KEYS" ]; then
            echo "BLOCKED — CONFIRMATION PHRASE INVALID"
            exit 1
          fi
          echo "confirmation: ACCEPTED"
          echo "stage: diagnose-foreign-keys"

      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require isolated owner secret
        env:
          AETHER_0036_ISOLATED_OWNER_URL: ${{ secrets.AETHER_0036_ISOLATED_OWNER_URL }}
        run: |
          if [ -z "$AETHER_0036_ISOLATED_OWNER_URL" ]; then
            echo "BLOCKED — AETHER_0036_ISOLATED_OWNER_URL is absent. No database was opened."
            exit 1
          fi
          echo "AETHER_0036_ISOLATED_OWNER_URL: PRESENT"

      - name: Read foreign keys and fixture-not-legal dependencies
        env:
          AETHER_0036_ISOLATED_OWNER_URL: ${{ secrets.AETHER_0036_ISOLATED_OWNER_URL }}
          A3M36_FK_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/a3-m36-isolated-fk-diagnostic.mjs

# A3-M36 isolated agreement cleanup. Manual dispatch only.
# Deletes one inactive fixture-not-legal catalogue row.
# Does not install SQL, recover fixtures, or run concurrency.
# Does not use a Production credential. Does not disable triggers.
name: A3-M36 isolated agreement cleanup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact confirmation CLEANUP-0036-AGREEMENT-ISOLATED
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: a3-m36-isolated-agreement-cleanup
  cancel-in-progress: false

jobs:
  agreement-cleanup:
    name: cleanup-0036-agreement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the agreement cleanup confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "CLEANUP-0036-AGREEMENT-ISOLATED" ]; then
            echo "BLOCKED — CONFIRMATION PHRASE INVALID"
            exit 1
          fi
          echo "confirmation: ACCEPTED"
          echo "stage: cleanup-0036-agreement"

      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require isolated owner secret
        env:
          AETHER_0036_ISOLATED_OWNER_URL: ${{ secrets.AETHER_0036_ISOLATED_OWNER_URL }}
        run: |
          if [ -z "$AETHER_0036_ISOLATED_OWNER_URL" ]; then
            echo "BLOCKED — AETHER_0036_ISOLATED_OWNER_URL is absent. No database was opened."
            exit 1
          fi
          echo "AETHER_0036_ISOLATED_OWNER_URL: PRESENT"

      - name: Remove the inactive agreement catalogue row
        env:
          AETHER_0036_ISOLATED_OWNER_URL: ${{ secrets.AETHER_0036_ISOLATED_OWNER_URL }}
          A3M36_AGREEMENT_CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/a3-m36-isolated-agreement-cleanup.mjs

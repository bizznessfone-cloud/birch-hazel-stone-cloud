# A3-M36 isolated fixture recovery. Manual dispatch only.
# Does not install SQL. Does not run the concurrency gate.
# Does not use a Production credential. Does not disable triggers.
# One cleanup transaction. A refusal preserves the fixture rows.
name: A3-M36 isolated recovery

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact confirmation RECOVER-0036-ISOLATED
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: a3-m36-isolated-recovery
  cancel-in-progress: false

jobs:
  recovery:
    name: recover-0036-isolated
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the recovery confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "RECOVER-0036-ISOLATED" ]; then
            echo "BLOCKED — CONFIRMATION PHRASE INVALID"
            exit 1
          fi
          echo "confirmation: ACCEPTED"
          echo "stage: recover-0036"

      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require isolated owner secret
        env:
          AETHER_0036_ISOLATED_OWNER_URL: ${{ secrets.AETHER_0036_ISOLATED_OWNER_URL }}
        run: |
          if [ -z "$AETHER_0036_ISOLATED_OWNER_URL" ]; then
            echo "BLOCKED — AETHER_0036_ISOLATED_OWNER_URL is absent. No database was opened."
            exit 1
          fi
          echo "AETHER_0036_ISOLATED_OWNER_URL: PRESENT"

      - name: Recover marker fixtures on the isolated branch
        env:
          AETHER_0036_ISOLATED_OWNER_URL: ${{ secrets.AETHER_0036_ISOLATED_OWNER_URL }}
          A3M36_RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/a3-m36-isolated-recovery.mjs

name: CP26 Stripe Test Execute

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY-CP26-STRIPE-TEST
        required: true
        type: string
      mode:
        description: apply, checkout-plan, or verify
        required: true
        type: string
      price_major:
        description: EUR major amount for apply only
        required: false
        type: string
      stripe_product_id:
        description: TEST product id
        required: false
        type: string
      stripe_price_id:
        description: TEST price id
        required: false
        type: string
      quantity:
        description: Checkout quantity for checkout-plan
        required: false
        type: string
        default: "3"

permissions:
  contents: read

concurrency:
  group: production-database-mutation
  cancel-in-progress: false

jobs:
  execute:
    name: execute
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute CP26 Stripe test step
        env:
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
          CP26_CONFIRMATION: ${{ inputs.confirmation }}
          CP26_MODE: ${{ inputs.mode }}
          CP26_PRICE_MAJOR: ${{ inputs.price_major }}
          CP26_STRIPE_PRODUCT_ID: ${{ inputs.stripe_product_id }}
          CP26_STRIPE_PRICE_ID: ${{ inputs.stripe_price_id }}
          CP26_QUANTITY: ${{ inputs.quantity }}
        run: node --experimental-strip-types scripts/cp26-stripe-test-execute.mjs

name: A3 admission offline tests
on:
  push:
    branches:
      - review/a3-m36-closeout-0035-0036-admission
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ""
      AETHER_DATABASE_OWNER_URL: ""
      NEON_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/a3-0035-0036-production-admission-preflight.test.mjs

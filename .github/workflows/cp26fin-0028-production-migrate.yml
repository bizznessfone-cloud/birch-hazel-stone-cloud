name: CP26 FINALISATION Single-Use 0028 Production Migrate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY-0028
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-mutation
  cancel-in-progress: false

jobs:
  apply-0028:
    name: apply-0028
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply reviewed 0028 only
        env:
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
          CP26FIN_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/cp26fin-0028-production-migrate.mjs

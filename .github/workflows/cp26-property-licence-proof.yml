name: CP26 Property Licence Proof
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ALLOCATE-CP26-PROPERTY-LICENCE
        required: true
        type: string
      mode:
        description: reconcile or allocate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-database-mutation
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run CP26 property licence proof
        env:
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
          CP26_CONFIRMATION: ${{ inputs.confirmation }}
          CP26_MODE: ${{ inputs.mode }}
        run: node scripts/cp26-property-licence-proof.mjs

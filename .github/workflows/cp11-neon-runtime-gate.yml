# TEMPORARY CP11 Neon runtime gate.
# workflow_dispatch only. Do not add a push trigger.
# Deletes after the single verification result is obtained.
name: CP11 Neon Runtime Gate

on:
  workflow_dispatch:

jobs:
  verify-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Discard lockfile mutation
        run: git checkout -- package-lock.json

      - name: Correct catalog-owner query in runner only
        run: |
          set -euo pipefail
          sed -i 's/pg_get_userbyid(t.tgowner) as owner/pg_get_userbyid(c.relowner) as owner/' scripts/verify-neon-production.mjs
          grep -n 'c.relowner' scripts/verify-neon-production.mjs
          if grep -n 't.tgowner' scripts/verify-neon-production.mjs; then
            echo "FAIL: t.tgowner still present after runner-only correction"
            exit 1
          fi
          echo "Runner working tree contains c.relowner; this change is not committed."

      - name: Run CP11 production gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
        run: npm run verify:neon

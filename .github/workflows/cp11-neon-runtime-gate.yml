# TEMPORARY CP11 Neon runtime gate.
# workflow_dispatch only. Do not add a push trigger.
# Deletes after the single verification result is obtained.
name: CP11 Neon Runtime Gate

on:
  workflow_dispatch:

jobs:
  verify-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Discard lockfile mutation
        run: git checkout -- package-lock.json

      - name: Runner-only verifier patches
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path("scripts/verify-neon-production.mjs")
          s = p.read_text()
          a, b = "pg_get_userbyid(t.tgowner) as owner", "pg_get_userbyid(c.relowner) as owner"
          if a not in s:
              raise SystemExit("expected t.tgowner catalog query not found")
          s = s.replace(a, b, 1)
          opt = "    options: `-c role=${RUNTIME}`,\n"
          if opt not in s:
              raise SystemExit("expected runtimePool options role parameter not found")
          s = s.replace(opt, "", 1)
          if "options: `-c role=${RUNTIME}`" in s or "t.tgowner" in s:
              raise SystemExit("runner patch incomplete")
          if "c.relowner" not in s:
              raise SystemExit("c.relowner missing after patch")
          p.write_text(s)
          print("runtimePool options role parameter: ABSENT")
          print("trigger owner query: c.relowner")
          PY

      - name: Verify runner-only patches
        run: |
          set -euo pipefail
          if grep -F -- '-c role=' scripts/verify-neon-production.mjs; then
            echo "FAIL: runtimePool still has options role parameter"
            exit 1
          fi
          echo "runtimePool options role parameter: ABSENT"
          grep -n 'c.relowner' scripts/verify-neon-production.mjs
          if grep -n 't.tgowner' scripts/verify-neon-production.mjs; then
            echo "FAIL: t.tgowner still present"
            exit 1
          fi
          echo "trigger owner query: c.relowner"

      - name: Run CP11 production gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AETHER_DATABASE_OWNER_URL: ${{ secrets.AETHER_DATABASE_OWNER_URL }}
        run: npm run verify:neon
